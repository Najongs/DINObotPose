name: dinobotpose
channels: [conda-forge]
dependencies:
  - python=3.10
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.10.0
      - torchvision==0.25.0
      - numpy==1.26.4
      - opencv-python-headless==4.13.0.92
      - pillow==12.1.1
      - tqdm==4.67.3
      - transformers==5.2.0
      - albumentations==2.0.8
      - huggingface_hub==1.5.0
      # Training only; inference does not import these.
      - wandb==0.25.0
      - pyyaml==6.0.3
