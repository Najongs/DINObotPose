[project]
name = "dinobotpose"
version = "1.0.0"
description = "Monocular robot pose and joint-angle estimation by iterative model fitting on frozen foundation features"
requires-python = ">=3.10,<3.11"
dependencies = [
    "torch==2.10.0",
    "torchvision==0.25.0",
    "numpy==1.26.4",
    "opencv-python-headless==4.13.0.92",
    "pillow==12.1.1",
    "tqdm==4.67.3",
    "transformers==5.2.0",
    "albumentations==2.0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinobotpose"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
