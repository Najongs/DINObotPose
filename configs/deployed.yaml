# The deployed configuration. Every number reported in the paper uses exactly these settings,
# identically for every camera and every robot.
#
# What the fit does NOT use, and why. Each removal is the measured cost of keeping it, so a
# negative number means the component was hurting; the subset each was measured on is named.
#   confidence gate        removed: -0.02 clean (1,000 RealSense frames), -0.04 at 40% occlusion
#                          (300 photorealistic frames). A minimum-keypoint floor overrode it, so
#                          it could never drop more than one of seven keypoints.
#   covariance weighting   removed: -0.3 on the four-camera mean, full test sets, sign varied by camera
#   divergence guard       removed. Full test sets: exactly 0.00 on Kinect360 and RealSense, to
#                          every reported decimal, and +0.20 on Azure, where it rescues about
#                          thirteen frames of 6,394 from the failure tail (mean ADD 23.8 against
#                          25.1 mm, median unmoved). On KUKA's domain-randomized split it is
#                          -0.02, so keeping it is a loss there. Kept out because a component
#                          that changes one split by a fifth of a point, three others not at
#                          all, and the second robot the wrong way is not worth the reader's
#                          attention.
#   render-and-compare     removed: +-0.0 once the detector was augmentation-trained
#   detection-box union    removed. Uniting the skeleton box with the confident-detection box
#                          buys at most +0.1 on the Panda real mean and +0.3 at heavy occlusion,
#                          and costs 1.3-1.5 on both KUKA splits, whose look-alike links yield
#                          spurious confident detections that inflate the box.
#   crop-detector budget   12 epochs. A budget ladder at 12/24/36/48/100 epochs, each trained from
#                          the same warm start and evaluated on the full real splits, gives means of
#                          82.7/82.4/84.1/83.4/83.5: not monotone, and the four retrained points
#                          scatter with a standard deviation of 0.7, so no budget beyond 12 is a
#                          reliable lever. The validation curve of the 100-epoch run converges by
#                          epoch 10 and peaks at epoch 51, which is why the extra epochs buy nothing.
pipeline:
  input_size: 512
  passes: 2                 # full frame, then a crop the first pass derives for itself
  box: solved_skeleton      # the projected first-pass skeleton's bounding box, squared and padded
  decode: dark              # sub-pixel heatmap decoding
fit:
  # Unified for both robots. The KUKA evaluator historically defaulted to 250; re-measuring its
  # full test sets at 200 costs 0.1 on DR (80.6 to 80.5) and 0.2 on Photo (79.0 to 78.8), both
  # still ahead of every compared method, so the budget is one number and the one-configuration
  # claim is literally true. eval.py passes it explicitly so the old defaults cannot resurface.
  iterations: 200
  optimizer: adam
  learning_rate: 0.02
  robust_kernel: lorentzian      # IRLS weight kappa^2/(kappa^2+r^2), knee 8 px, enabled after a 30-iteration warm-up
  loss: huber                    # knee ~5 px on the image-normalised residual
  free_variables: [joint_angles, rotation, translation]   # 12 DOF; terminal wrist roll fixed at 0
eval:
  metric: add_auc
  threshold_mm: 100
  batch_size: 24
