# The deployed configuration. Every number reported in the paper uses exactly these settings,
# identically for every camera and every robot.
#
# What the fit does NOT use, and why. Each removal is the measured cost of keeping it, so a
# negative number means the component was hurting; the subset each was measured on is named.
#   confidence gate        removed: -0.02 clean (1,000 RealSense frames), -0.04 at 40% occlusion
#                          (300 photorealistic frames). A minimum-keypoint floor overrode it, so
#                          it could never drop more than one of seven keypoints.
#   covariance weighting   removed: -0.3 on the four-camera mean, full test sets, sign varied by camera
#   divergence guard       removed. Full test sets: exactly 0.00 on Kinect360 and RealSense, to
#                          every reported decimal, and +0.20 on Azure, where it rescues about
#                          thirteen frames of 6,394 from the failure tail (mean ADD 23.8 against
#                          25.1 mm, median unmoved). Kept out because a component that changes
#                          one split by a fifth of a point and three others not at all is not
#                          worth the reader's attention.
#   render-and-compare     removed: +-0.0 once the detector was augmentation-trained
pipeline:
  input_size: 512
  passes: 2                 # full frame, then a crop the first pass derives for itself
  box: union                # solved skeleton projected back, united with confident detections
  decode: dark              # sub-pixel heatmap decoding
fit:
  iterations: 200
  optimizer: adam
  learning_rate: 0.02
  robust_kernel: geman_mcclure   # IRLS weight, knee 8 px, enabled after a 30-iteration warm-up
  loss: huber                    # knee ~5 px on the image-normalised residual
  free_variables: [joint_angles, rotation, translation]   # 12 DOF; terminal wrist roll fixed at 0
eval:
  metric: add_auc
  threshold_mm: 100
  batch_size: 24
